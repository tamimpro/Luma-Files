name: Android CI - File Manager (Luma Files v1.2.0)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build APK, Run Engine Tests & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle 9.3.1
        run: |
          GRADLE_VERSION="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Fallback Debug Keystore (if not present)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Automated File-System, Vault DEK, ZIP Security & Download Engine Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble v1.2.0 APK
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LumaFiles-FileManager-v1.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LumaFiles-FileManager.apk

      - name: Upload APK to Workflow Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumaFiles-FileManager-v1.2.0-APK
          path: |
            app/build/outputs/apk/debug/LumaFiles-FileManager-v1.2.0.apk
            app/build/outputs/apk/debug/LumaFiles-FileManager.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.2.${{ github.run_number }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              app/build/outputs/apk/debug/LumaFiles-FileManager-v1.2.0.apk \
              app/build/outputs/apk/debug/LumaFiles-FileManager.apk \
              --clobber
          else
            gh release create "$TAG_NAME" \
              app/build/outputs/apk/debug/LumaFiles-FileManager-v1.2.0.apk \
              app/build/outputs/apk/debug/LumaFiles-FileManager.apk \
              --title "File Manager (Luma Files) $TAG_NAME" \
              --notes "Automated v1.2.0 release of **File Manager (Luma Files)** (`com.lumafiles.filemanager`). Download **LumaFiles-FileManager-v1.2.0.apk** below to install directly on your Android device."
          fi
